name: functions-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  functions-build:
    name: Compile / bundle Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      # Bootstrap stage: functions/package.json defines a placeholder
      # "build" script. Once Cloud Functions source lands, this should
      # compile via `tsc -p functions/tsconfig.json` (or the functions
      # workspace's own build tool) with no network calls and no
      # credentials of any kind.
      - name: Build functions
        run: npm run build --workspace=functions --if-present
