name: mobile-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-check:
    name: Mobile configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check for Expo app config
        id: check
        run: |
          if [ -f "apps/mobile/app.json" ] || [ -f "apps/mobile/app.config.js" ] || [ -f "apps/mobile/app.config.ts" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Bootstrap stage: apps/mobile has no Expo app config yet (no product
      # code has been implemented — see apps/mobile/README.md). Once an
      # Expo app exists, this should run `npx expo-doctor` (or equivalent
      # lightweight config validation) from apps/mobile. Full native builds
      # remain EAS-only per
      # docs/implementation/v4-implementation-research/00-README.md and the
      # architecture-research EAS packet — never run from this workflow.
      - name: Run expo-doctor
        if: steps.check.outputs.present == 'true'
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: No Expo app config yet
        if: steps.check.outputs.present == 'false'
        run: echo "No Expo app.json/app.config found under apps/mobile. Skipping — expected at bootstrap stage."
