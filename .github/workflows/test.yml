name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (packages/shared, functions, apps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      # Bootstrap stage: placeholder "test" scripts only. No production
      # secrets are required for unit tests — pure logic (money helpers,
      # status transitions, pricing) should not need network or Firebase
      # access at all.
      - name: Run unit tests across workspaces
        run: npm run test --workspaces --if-present
