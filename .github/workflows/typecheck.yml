name: typecheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript across workspaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      # Bootstrap stage: each workspace's package.json currently defines a
      # placeholder "typecheck" script. Once product code lands, each
      # workspace should replace its placeholder with `tsc --noEmit` (or
      # equivalent) against its own tsconfig.json (which extends
      # tsconfig.base.json at the repo root).
      - name: Run typecheck across workspaces
        run: npm run typecheck --workspaces --if-present
